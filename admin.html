<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Offers | Admin | Standard Mobile Company</title>
<meta name="robots" content="noindex,nofollow"/>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'"/>
<meta name="referrer" content="no-referrer"/>
<link rel="stylesheet" href="assets/stock/stock.css"/>
</head>
<body>

<nav>
  <div class="nav-in">
    <a class="nav-logo" href="index.html"><img src="assets/logo.png?v=3" alt="Standard Mobile Company"/></a>
    <div class="nav-r">
      <a class="link active" href="admin.html">Offers</a>
      <a class="link" href="stock.html">Stock</a>
    </div>
  </div>
</nav>

<main class="wrap">
  <header class="page-head">
    <span class="eyebrow">Admin</span>
    <h1 id="admin-title">Offers.</h1>
    <p id="admin-intro">Review offers below asking price. Accept to send an invoice, deny, or send a counter (the customer gets an email either way). Invoiced listings show eBay links so you can end them.</p>
    <div class="admin-note" id="admin-note" hidden></div>
    <div class="admin-sections">
      <a class="chip active" id="sec-offers" href="#offers">Offers</a>
      <a class="chip" id="sec-buyers" href="#buyers">Buyers <span class="c" id="buyers-pending"></span></a>
    </div>
  </header>

  <section id="offers-panel">
    <div class="tabs" id="tabs" role="tablist" aria-label="Offer status"></div>
    <div id="offers" aria-live="polite"><div class="loading">Loading offers&hellip;</div></div>
  </section>

  <section id="buyers-panel" hidden>
    <div class="tabs" id="buyer-tabs" role="tablist" aria-label="Buyer status"></div>
    <div id="buyers" aria-live="polite"><div class="loading">Loading buyers&hellip;</div></div>
  </section>
</main>

<script type="module" src="assets/stock/admin.js"></script>
</body>
</html>
